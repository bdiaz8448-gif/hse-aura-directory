<style>

  .stat{display:inline-block;margin-right:20px;font-size:13px}
  .stat b{display:block;font-size:26px;color:var(--gold);font-weight:800}
  .stat.new b{color:#B8CC7A}
  .stat.dup b{color:#888}
  .stat.upd b{color:var(--cyan)}
  #log{background:#000;border:1px solid rgba(255,255,255,.10);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:11px;max-height:340px;overflow-y:auto;white-space:pre-wrap;color:#9adb9a}

  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
  th{text-align:left;padding:7px;color:var(--gold);border-bottom:1px solid rgba(255,255,255,.14);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  td{padding:6px 7px;border-bottom:1px solid rgba(255,255,255,.05)}
  .preview{max-height:300px;overflow-y:auto;margin-top:8px}
  .bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin:10px 0}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--olive),var(--cyan));width:0;transition:width .2s}
</style>

var toAdd = [], toUpdate = [], dupes = [];

function log(msg, cls){
  var el = document.getElementById('log');
  el.innerHTML += '\n' + (cls ? '<span class="'+cls+'">'+msg+'</span>' : msg);
  el.scrollTop = el.scrollHeight;
}
function normPhone(p){ return (p||'').replace(/[^0-9]/g,'').replace(/^1(?=\d{10}$)/,''); }
function normEmail(e){ return (e||'').trim().toLowerCase(); }
function normName(n){ return (n||'').trim().toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' '); }

function scanExisting(){
  document.getElementById('log').innerHTML = 'Scanning Firestore contacts collection...';
  db.collection('contacts').get().then(function(snap){
    var byEmail = {}, byNamePhone = {}, byName = {};
    snap.forEach(function(doc){
      var d = doc.data();
      var em = normEmail(d.email);
      var nm = normName(d.name);
      var ph = normPhone(d.cellPhone) || normPhone(d.officePhone);
      if(em) byEmail[em] = {id:doc.id, data:d};
      if(nm) { byName[nm] = {id:doc.id, data:d};
               if(ph) byNamePhone[nm+'|'+ph] = {id:doc.id, data:d}; }
    });
    log('Found ' + snap.size + ' existing contacts in directory.', 'ok');

    toAdd = []; toUpdate = []; dupes = [];
    var seenInBatch = {};

    INCOMING.forEach(function(c){
      var em = normEmail(c.email);
      var nm = normName(c.name);
      var ph = normPhone(c.phone);

      // Guard against duplicates inside the incoming batch itself
      var batchKey = em || (nm + '|' + ph);
      if(seenInBatch[batchKey]) { dupes.push({c:c, why:'duplicate within source files'}); return; }
      seenInBatch[batchKey] = 1;

      // Match against existing directory
      var match = null, why = '';
      if(em && byEmail[em]) { match = byEmail[em]; why = 'email already in directory'; }
      else if(nm && ph && byNamePhone[nm+'|'+ph]) { match = byNamePhone[nm+'|'+ph]; why = 'name + phone already in directory'; }
      else if(nm && byName[nm]) { match = byName[nm]; why = 'name already in directory'; }

      if(match){
        // Does the existing record have gaps we can fill?
        var ex = match.data, upd = {};
        if(!ex.email && c.email) upd.email = c.email;
        if(!ex.cellPhone && !ex.officePhone && c.phone) upd.cellPhone = c.phone;
        if(!ex.company && c.company) upd.company = c.company;
        if(!ex.role && c.role) upd.role = c.role;
        if(Object.keys(upd).length){ toUpdate.push({id:match.id, name:c.name, upd:upd, existing:ex}); }
        else { dupes.push({c:c, why:why}); }
      } else {
        toAdd.push(c);
      }
    });

    log('');
    log('NEW contacts to add:      ' + toAdd.length, 'ok');
    log('EXISTING to fill gaps:    ' + toUpdate.length, 'warn');
    log('Skipped (already there):  ' + dupes.length, 'dim');

    document.getElementById('stats').innerHTML =
      '<span class="stat new"><b>'+toAdd.length+'</b>new to add</span>' +
      '<span class="stat upd"><b>'+toUpdate.length+'</b>to update</span>' +
      '<span class="stat dup"><b>'+dupes.length+'</b>skipped (duplicate)</span>' +
      '<span class="stat"><b>'+snap.size+'</b>already in directory</span>';

    if(toAdd.length || toUpdate.length){
      document.getElementById('btnImport').disabled = false;
      var t = '<tr><th>Action</th><th>Name</th><th>Company</th><th>Phone</th><th>Email</th><th>Role</th></tr>';
      toAdd.forEach(function(c){
        t += '<tr><td style="color:#B8CC7A">ADD</td><td>'+c.name+'</td><td>'+c.company+'</td><td>'+c.phone+'</td><td>'+(c.email||'—')+'</td><td>'+(c.role||'—')+'</td></tr>';
      });
      toUpdate.forEach(function(u){
        t += '<tr><td style="color:#4FC3E8">UPDATE</td><td>'+u.name+'</td><td colspan="4" class="dim">fills: '+Object.keys(u.upd).join(', ')+'</td></tr>';
      });
      document.getElementById('previewTable').innerHTML = t;
      document.getElementById('previewCard').style.display = 'block';
      log('');
      log('Review the preview below, then click "Import new contacts".', 'warn');
    } else {
      log('');
      log('Nothing to import — directory is already up to date.', 'ok');
    }
  }).catch(function(e){
    log('ERROR: ' + e.message, 'err');
  });
}

function runImport(){
  document.getElementById('btnImport').disabled = true;
  var total = toAdd.length + toUpdate.length, done = 0, failed = 0;
  log(''); log('=== IMPORT STARTED ===', 'warn');

  function tick(){
    done++;
    document.getElementById('bar').style.width = Math.round(done/total*100)+'%';
    if(done >= total){
      log('');
      log('=== IMPORT COMPLETE ===', 'ok');
      log('Added:   ' + toAdd.length, 'ok');
      log('Updated: ' + toUpdate.length, 'ok');
      if(failed) log('Failed:  ' + failed, 'err');
      log('');
      log('Open the AURA HSE Directory and pull down to refresh.', 'warn');
    }
  }

  toAdd.forEach(function(c, i){
    var id = 'imp_' + Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2,7);
    var rec = {
      id: id,
      name: c.name,
      role: c.role || '',
      company: c.company || '',
      cellPhone: c.phone || '',
      officePhone: '',
      email: c.email || '',
      trailer: '',
      notifyDSM4: false,
      notifyDSM3: false
    };
    db.collection('contacts').doc(id).set(rec)
      .then(function(){ log('  + ' + c.name + ' (' + c.company + ')', 'ok'); tick(); })
      .catch(function(e){ failed++; log('  ! ' + c.name + ' — ' + e.message, 'err'); tick(); });
  });

  toUpdate.forEach(function(u){
    db.collection('contacts').doc(u.id).update(u.upd)
      .then(function(){ log('  ~ ' + u.name + ' updated: ' + Object.keys(u.upd).join(', '), 'ok'); tick(); })
      .catch(function(e){ failed++; log('  ! ' + u.name + ' — ' + e.message, 'err'); tick(); });
  });
}
