<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#071226">
<title>Amgen ANC-2 &mdash; HSE Directory</title>
<style>
  /* Same look and layout as the Fujifilm Aura directory. Turner people carry the
     Turner blue accent where Aura uses the Jacobs olive; Amgen / ATS stay teal. */
  :root{
    --bg:#050607;
    --surface-1:rgba(255,255,255,0.04);
    --surface-2:rgba(255,255,255,0.07);
    --surface-3:rgba(255,255,255,0.11);
    --border-dim:rgba(255,255,255,0.09);
    --border-bright:rgba(255,255,255,0.2);
    --text:#f0f0f0;
    --text-2:rgba(255,255,255,0.60);
    --text-3:rgba(255,255,255,0.35);
    --gold:#C9A84C;
    --gold-dim:rgba(201,168,76,0.15);
    --gold-border:rgba(201,168,76,0.45);
    --cyan:#00d4ff;
    --cyan-dim:rgba(0,212,255,0.10);
    --cyan-border:rgba(0,212,255,0.38);
    --ruby:#C0392B;
    --ruby-dim:rgba(192,57,43,0.22);
    --ruby-border:rgba(192,57,43,0.48);
    --ruby-glow:rgba(192,57,43,0.35);
    --blue:#2f8cff;            /* Turner blue */
    --blue-lite:#8cc2ff;
    --blue-dim:rgba(47,140,255,0.14);
    --blue-border:rgba(47,140,255,0.55);
    --teal:#22c3b5;            /* Amgen / medic */
    --teal-dim:rgba(34,195,181,0.13);
    --green:#4cd38a;
    --shadow-sm:0 2px 8px rgba(0,0,0,0.45);
    --shadow-md:0 4px 24px rgba(0,0,0,0.60);
    --shadow-lg:0 8px 40px rgba(0,0,0,0.72);
  }
  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  @supports (overflow:clip){ html,body{overflow-x:clip} }  /* hidden would stop the EMERGENCY bar from staying pinned */
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);padding:16px;min-height:100vh}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 130% 55% at 50% -5%,rgba(0,212,255,0.055) 0%,transparent 65%),
               radial-gradient(ellipse 80% 40% at 90% 105%,rgba(192,57,43,0.04) 0%,transparent 60%),
               radial-gradient(ellipse 60% 50% at 5% 80%,rgba(201,168,76,0.03) 0%,transparent 55%)}
  .wrap{max-width:100%;margin:0 auto;position:relative;z-index:1}

  /* ── Title + status ── */
  h1{color:#fff;font-size:22px;font-weight:700;margin:0 0 14px;text-align:center;letter-spacing:.04em;
     text-shadow:0 0 28px rgba(0,212,255,0.28),0 2px 4px rgba(0,0,0,0.6)}
  .status{text-align:center;font-size:12px;margin:-6px 0 12px;color:var(--text-3)}
  .status.live{color:#6fcf6f;text-shadow:0 0 8px rgba(111,207,111,0.4)}
  .status.off{color:#e0a64a}

  /* ── EMERGENCY bar: pinned to the top so it is reachable at any scroll position ── */
  .hotline-bar{position:sticky;top:0;z-index:40;display:block;width:100%;height:52px;margin:0 0 14px;padding:0 18px;
    border-radius:12px;border:1px solid var(--ruby-border);cursor:pointer;color:#fff;font-size:20px;font-weight:800;letter-spacing:1.5px;
    background:linear-gradient(135deg,rgba(178,45,32,0.985),rgba(112,14,9,0.985));
    box-shadow:0 0 26px rgba(192,57,43,0.32),inset 0 1px 0 rgba(255,255,255,0.14);text-shadow:0 1px 4px rgba(0,0,0,0.5)}
  .hotline-bar:active{background:linear-gradient(135deg,rgba(160,38,26,0.82),rgba(105,12,8,0.70))}

  /* ── Tabs ── */
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tab-btn{flex:1 1 30%;min-width:140px;height:54px;font-size:15px;font-weight:600;border-radius:10px;border:1px solid var(--border-dim);
    background:var(--surface-1);color:var(--text-2);cursor:pointer;padding:0 8px;line-height:1.15;
    transition:background .18s,border-color .18s,color .18s,box-shadow .18s}
  .tab-btn:not(.active):hover{border-color:rgba(0,212,255,0.60);color:#7fe3ff;background:rgba(0,212,255,0.10)}
  .tab-btn.active{background:linear-gradient(135deg,rgba(0,212,255,0.18),rgba(0,150,200,0.11));border-color:var(--cyan-border);
    color:var(--cyan);box-shadow:0 0 18px rgba(0,212,255,0.14),inset 0 1px 0 rgba(0,212,255,0.2)}
  .tab-btn .n{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;opacity:.75}

  /* ── Lock / pending / language row ── */
  .sync-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
  .sync-row button{flex:1 1 auto;min-width:92px;max-width:100%;white-space:nowrap;height:46px;font-size:15px;padding:0 10px;border-radius:10px;
    background:var(--surface-1);color:var(--text-2);border:1px solid var(--border-dim);cursor:pointer}
  .sync-row button:hover{border-color:rgba(0,212,255,0.55);color:#7fe3ff}
  #lockStatusBtn{flex:1 1 auto}
  #langBtn{flex:0 0 auto;min-width:96px}
  #lockStatusBtn.unlocked{background:rgba(47,110,63,0.24);color:#6fcf6f;border-color:rgba(47,110,63,0.50);box-shadow:0 0 16px rgba(47,110,63,0.20)}
  #pendBtn{background:rgba(230,81,0,0.16);border-color:rgba(230,81,0,0.55);color:#ffb37a;font-weight:700}
  #pendBtn .badge{display:inline-block;background:#fff;color:#e65100;border-radius:10px;padding:0 6px;font-size:12px;font-weight:900;margin-left:4px}

  /* ── Section toolbar ── */
  .hint{text-align:center;font-size:12px;color:var(--text-3);margin:8px 0 14px;line-height:1.4}
  .toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .search{flex:1;min-width:220px;height:52px;font-size:18px;padding:0 16px;border-radius:10px;border:1px solid var(--border-dim);
    background:rgba(255,255,255,0.05);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
  .search::placeholder{color:var(--text-3)}
  .search:focus{border-color:var(--cyan-border);box-shadow:0 0 0 3px rgba(0,212,255,0.10)}
  .addbtn{height:52px;padding:0 18px;font-size:16px;font-weight:700;border-radius:10px;cursor:pointer;color:#1a1200;
    background:linear-gradient(135deg,rgba(201,168,76,0.82),rgba(185,142,45,0.70));border:1px solid var(--gold-border);
    box-shadow:0 0 20px rgba(201,168,76,0.22),inset 0 1px 0 rgba(255,255,255,0.22)}
  .addbtn:hover{background:linear-gradient(135deg,rgba(220,185,90,0.90),rgba(201,168,76,0.80))}
  .filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  select{height:44px;font-size:15px;padding:0 10px;border-radius:10px;border:1px solid var(--border-dim);background:rgba(255,255,255,0.06);
    color:var(--text);outline:none;cursor:pointer;max-width:100%}
  select:focus{border-color:var(--cyan-border)}
  select option{background:#111;color:var(--text)}
  .count{color:var(--text-3);font-size:14px;margin-left:auto}

  /* ── Cards ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .card{background:linear-gradient(135deg,rgba(255,255,255,0.060),rgba(255,255,255,0.028));border-radius:12px;padding:14px;display:flex;gap:12px;
    align-items:center;cursor:pointer;border:1px solid var(--border-dim);min-width:0;position:relative;
    box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,0.07);transition:border-color .2s,box-shadow .2s,background .2s}
  .card.turner{border-color:rgba(47,140,255,0.42)}
  .card.amgen{border-color:rgba(34,195,181,0.42)}
  /* One cyan frame on hover for every card. No transform: sub-pixel shifts make some borders soft. */
  .card:hover,.card.turner:hover,.card.amgen:hover{border-color:#00d4ff;
    box-shadow:0 0 0 2px rgba(0,212,255,0.70),0 0 30px rgba(0,212,255,0.32),var(--shadow-sm);
    background:linear-gradient(135deg,rgba(0,212,255,0.17),rgba(0,212,255,0.075))}
  .card:hover .card-name{color:#7fe3ff}
  @media (hover:none){
    .card:hover,.card.turner:hover,.card.amgen:hover{box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,0.07);
      background:linear-gradient(135deg,rgba(255,255,255,0.060),rgba(255,255,255,0.028))}
    .card:hover{border-color:var(--border-dim)}.card.turner:hover{border-color:rgba(47,140,255,0.42)}.card.amgen:hover{border-color:rgba(34,195,181,0.42)}
    .card:hover .card-name{color:inherit}
  }
  .card:active{background:rgba(201,168,76,0.09);border-color:var(--gold-border)}
  .card-body{min-width:0;flex:1}
  .avatar{width:42px;height:42px;min-width:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
    background:linear-gradient(135deg,rgba(201,168,76,0.85),rgba(175,135,32,0.65));color:#1a1200;border:1px solid var(--gold-border);
    box-shadow:0 0 12px rgba(201,168,76,0.22)}
  .avatar.turner{background:linear-gradient(135deg,#2f8cff,#1456b8);color:#fff;border-color:rgba(140,194,255,0.6);box-shadow:0 0 12px rgba(47,140,255,0.3)}
  .avatar.amgen{background:linear-gradient(135deg,#22c3b5,#0f7d74);color:#fff;border-color:rgba(34,195,181,0.6);box-shadow:0 0 12px rgba(34,195,181,0.25)}
  .card-name{font-weight:700;font-size:15px;margin:0;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-sub{font-size:13px;color:var(--text-2);margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tags{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;color:var(--gold);background:rgba(201,168,76,0.12);border:1px solid rgba(201,168,76,0.26)}
  .tag.safe{color:var(--green);background:rgba(76,211,138,0.12);border-color:rgba(76,211,138,0.32)}
  .tag.amg{color:var(--teal);background:var(--teal-dim);border-color:rgba(34,195,181,0.35)}
  .tag.vac{color:#ffc773;background:rgba(224,166,74,0.13);border-color:rgba(224,166,74,0.4)}

  .group{margin:22px 0 10px;padding:10px 12px;border-radius:10px;background:var(--surface-1);border-left:4px solid var(--blue);
    display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
  .group:first-child{margin-top:0}
  .group h2{margin:0;font-size:16px;color:#fff}
  .group .meta{font-size:13px;color:var(--text-2)}
  .group .sup{font-size:13px;color:var(--blue-lite);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .group.contractor{border-left-color:var(--gold)}

  .empty{text-align:center;color:var(--text-3);padding:40px 0;font-size:16px}
  .section{display:none}.section.active{display:block}

  /* ── Emergency page (same build as Aura) ── */
  .back-btn{display:block;width:100%;height:60px;margin-bottom:10px;font-size:14px;font-weight:700;border-radius:10px;cursor:pointer;
    border:1px solid var(--border-dim);background:var(--surface-1);color:var(--text-2)}
  .back-btn:hover{border-color:rgba(0,212,255,0.55);color:#7fe3ff}
  .site-strip{display:block;width:100%;text-align:center;padding:12px 14px;margin-bottom:14px;border-radius:10px;font-size:14px;line-height:1.4;font-weight:700;
    background:linear-gradient(135deg,rgba(201,168,76,0.26),rgba(185,142,45,0.18));color:var(--gold);border:1px solid var(--gold-border);
    box-shadow:0 0 18px rgba(201,168,76,0.16)}
  .site-strip .addr{display:block;color:#fff;font-size:17px;margin:3px 0}
  .site-strip a{color:#9ec7ff}
  .es{color:#9ec7ff;font-weight:600}
  .emergency-call-row{display:flex;gap:10px;margin-bottom:16px}
  .emergency-call-btn{flex:1;display:block;text-decoration:none;border-radius:12px;padding:14px 10px;text-align:center;border:1px solid transparent;min-width:0}
  .emergency-call-btn.medic{background:linear-gradient(135deg,rgba(201,168,76,0.30),rgba(185,142,45,0.20));border-color:var(--gold-border);color:#ffe8a0;
    box-shadow:0 0 18px rgba(201,168,76,0.16)}
  .emergency-call-btn.e911{background:linear-gradient(135deg,rgba(192,57,43,0.52),rgba(148,28,18,0.42));border-color:var(--ruby-border);color:#fff;
    box-shadow:0 0 22px var(--ruby-glow)}
  .emergency-call-num{font-size:26px;font-weight:800;display:block;line-height:1.2;margin:4px 0}
  .emergency-call-num.big{font-size:40px;line-height:1.05}
  .emergency-call-btn.security{background:linear-gradient(135deg,rgba(47,140,255,0.32),rgba(20,86,184,0.22));border-color:var(--blue-border);color:#fff;
    box-shadow:0 0 18px rgba(47,140,255,0.18)}
  .emergency-call-btn.security .es{color:#cfe3ff}
  .emergency-call-label{font-size:13px;font-weight:700;display:block;margin-bottom:2px}
  .emergency-call-sub{font-size:12px;display:block;margin-top:2px;line-height:1.3}
  .emergency-call-btn.medic .es{color:#2a5dab}
  .emergency-call-btn.e911 .es{color:#ffd9d4}
  .em-alt{display:inline-block;margin-top:6px;font-size:12px;color:#ffe8a0;text-decoration:underline}
  .emergency-section{background:linear-gradient(135deg,rgba(255,255,255,0.055),rgba(255,255,255,0.025));border:1px solid var(--border-dim);
    border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow-sm);color:#fff}
  .emergency-section h3{margin:0 0 10px;font-size:16.5px;color:#fff;font-weight:700}
  .emergency-section p{margin:0;font-size:14.5px;line-height:1.5;color:#fff}
  .emergency-step{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
  .emergency-step:last-child{margin-bottom:0}
  .emergency-step-num{width:30px;height:30px;min-width:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
    background:linear-gradient(135deg,rgba(192,57,43,0.75),rgba(130,18,12,0.55));color:#fff;border:1px solid var(--ruby-border);box-shadow:0 0 10px rgba(192,57,43,0.3)}
  .emergency-step-text{font-size:14.5px;line-height:1.5;color:#fff}
  .emergency-step-text b{display:block;margin-bottom:3px;font-weight:700}
  .emergency-step-text .es{display:block;margin-top:4px;font-weight:400}
  .emergency-step-text .es b{font-weight:700}
  .emergency-list{margin:0;padding-left:20px;font-size:14.5px;line-height:1.7;color:#fff}
  .em-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
  .em-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-1);border:1px solid var(--border-dim)}
  .em-row .t{flex:1;min-width:0}
  .em-row .t b{display:block;font-size:15px}
  .em-row .t span{display:block;font-size:13px;color:var(--text-2)}
  .em-row a.dial{flex:0 0 auto;height:42px;padding:0 14px;display:flex;align-items:center;border-radius:9px;font-weight:700;font-size:14px;text-decoration:none;
    color:#fff;background:linear-gradient(135deg,#2f8cff,#1456b8);border:1px solid var(--blue-border);white-space:nowrap}
  .em-person{cursor:pointer}
  .em-person:hover b{color:#7fe3ff}
  .em-place{padding:10px 12px;border-radius:10px;background:var(--surface-1);border:1px solid var(--border-dim);font-size:14px;line-height:1.5}
  .em-place a{color:#9ec7ff}
  .em-place .muted{color:var(--text-2)}
  .em-more{display:block;margin-top:8px;text-align:center;font-size:14px;color:#7fe3ff;text-decoration:underline;cursor:pointer}

  /* ── Modal ── */
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    align-items:center;justify-content:center;padding:16px;z-index:1000}
  #overlay.open{display:flex}
  #modal{background:linear-gradient(145deg,rgba(22,24,28,0.98),rgba(8,9,11,0.99));border:1px solid var(--border-bright);border-radius:16px;padding:22px;
    max-width:460px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg),0 0 44px rgba(0,212,255,0.08);position:relative}
  .x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--border-dim);background:var(--surface-2);
    color:var(--text);font-size:20px;cursor:pointer;line-height:1}
  .m-head{display:flex;gap:14px;align-items:center;margin:0 34px 14px 0}
  .m-head .avatar{width:56px;height:56px;min-width:56px;font-size:17px}
  .m-name{font-size:20px;font-weight:700;margin:0}
  .m-title{font-size:14px;color:var(--text-2);margin:3px 0 0}
  table{width:100%;font-size:15px;border-top:1px solid var(--border-dim);border-collapse:collapse;margin-bottom:14px}
  td{padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.05);vertical-align:top}
  .lbl{color:var(--text-3);white-space:nowrap;padding-right:12px}
  .val{text-align:right;word-break:break-word}
  .val a{color:#7fe3ff;text-decoration:none}
  .val .lnk{color:#7fe3ff;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{display:flex;align-items:center;justify-content:center;height:50px;border-radius:10px;font-size:16px;font-weight:700;text-decoration:none;
    color:#fff;background:var(--surface-2);border:1px solid var(--border-dim);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  .btn.call{background:linear-gradient(135deg,#2f8cff,#1456b8);border-color:var(--blue-border)}
  .btn.save{grid-column:1/-1;background:linear-gradient(135deg,rgba(76,211,138,0.9),rgba(30,150,90,0.85));border-color:rgba(76,211,138,0.6);color:#04210f}
  .btn.full{grid-column:1/-1}
  .btn.red{background:linear-gradient(135deg,#d23b2c,#8c160e);border-color:var(--ruby-border)}
  .btn.disabled{opacity:.35;pointer-events:none}
  .em-addr{font-size:14px;line-height:1.45;color:var(--text);padding:10px 12px;border-radius:10px;background:var(--surface-1);border:1px solid var(--border-dim);margin-bottom:6px}
  .divider{border-top:1px solid var(--border-dim);margin:14px 0 8px;padding-top:8px;font-size:12px;color:var(--text-3)}
  .stack{display:grid;gap:8px}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .btn.ghost{background:var(--surface-1)}
  .btn.redline{background:rgba(210,59,44,0.08);border-color:rgba(210,59,44,0.45);color:#ff8a7a;font-size:15px}
  .btn.del{background:rgba(210,59,44,0.18);border-color:rgba(210,59,44,0.5);color:#ff8a7a;font-weight:600}
  .btn.plain{font-weight:600;font-size:15px}
  .btn.vacbtn{background:#fff3dc;color:#5a3a00;border-color:#e8c27a;font-size:15px;margin-top:8px}
  .btn.small{height:42px;font-size:14px}
  .note{font-size:12px;color:var(--text-3);margin:6px 0 0;text-align:center}
  .addph{color:#ffc773;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .f{display:block;margin:0 0 10px}
  .f span{display:block;font-size:12px;color:var(--text-3);margin-bottom:4px}
  .f input,.f textarea,.f select{width:100%;height:46px;font-size:16px;padding:0 12px;border-radius:9px;border:1px solid var(--border-dim);
    background:rgba(255,255,255,0.06);color:var(--text);outline:none;font-family:inherit}
  .f textarea{height:80px;padding:10px 12px;resize:vertical}
  .f input:focus,.f textarea:focus{border-color:var(--cyan-border)}
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 12px}
  .checks label{display:flex;gap:8px;align-items:center;font-size:14px;padding:8px 10px;border-radius:8px;background:var(--surface-1);border:1px solid var(--border-dim)}
  .checks input{width:18px;height:18px}
  .m-sub{font-size:13px;color:var(--text-2);margin:-6px 0 14px}
  .req{padding:10px 12px;border-radius:10px;background:var(--surface-1);border:1px solid var(--border-dim);margin-bottom:8px;font-size:14px;line-height:1.45}
  .req b{color:#fff}.req .chg{color:#7fe3ff}
  .req .acts{display:flex;gap:8px;margin-top:8px}
  .req .acts .btn{height:40px;flex:1;font-size:14px}

}

/* Save to Contacts: a real .vcf file at a real https address is the only thing that works on
   every phone. Embedded browsers (Gmail, Messages, Outlook, Teams) hand the file to a preview
   with no "Add to Contacts", so hop out to the real browser first. */
function isEmbedded(){
  var ua=navigator.userAgent||'';
  if(/iPad|iPhone|iPod/.test(ua)){
    if(window.navigator.standalone===true) return false;
    if(/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua)) return false;
    if(/(FBAN|FBAV|Instagram|Line\/|Twitter|LinkedInApp|MicroMessenger|Snapchat|GSA\/)/i.test(ua)) return true;
    return !(/Version\//.test(ua) && /Safari\//.test(ua));
  }
  if(/Android/.test(ua)) return /;\s*wv\)/.test(ua) || /\bwv\b/.test(ua);
  return false;
}
function saveContact(a,ev){
  try{
    if(!isEmbedded()) return true;
    var abs=a.href, ua=navigator.userAgent||'';
    if(/iPad|iPhone|iPod/.test(ua)){ ev.preventDefault(); window.location.href='x-safari-'+abs; return false; }
    if(/Android/.test(ua)){ ev.preventDefault(); window.location.href='intent://'+abs.replace(/^https?:\/\//,'')+'#Intent;scheme=https;action=android.intent.action.VIEW;end'; return false; }
  }catch(err){}
  return true;
}

    +'<div class="em-place"><b>Occupational Clinic</b> <span class="es" style="display:inline">/ Cl&iacute;nica Ocupacional</span><br>AFC Urgent Care &middot; <a href="tel:9195904099">(919) 590-4099</a><br>'
    +'<span class="muted">1298 N. Main Street, Fuquay-Varina, NC 27526 &middot; M&ndash;F 7:30a&ndash;8p &middot; Sat&ndash;Sun 8a&ndash;5p</span> &middot; <a href="'+maps('AFC Urgent Care, 1298 N Main St, Fuquay-Varina, NC 27526')+'" target="_blank" rel="noopener">Map</a></div>'
    +'</div></div>'

    +'<div class="emergency-section"><h3>All Incidents Must Be Reported <span class="es">/ Todos los Incidentes Deben Reportarse</span></h3>'
    +'<ul class="emergency-list">'
    +'<li>Work injuries <span class="es" style="display:inline">/ Lesiones laborales</span></li>'
    +'<li>First aid cases <span class="es" style="display:inline">/ Casos de primeros auxilios</span></li>'
    +'<li>Near misses <span class="es" style="display:inline">/ Casi-accidentes</span></li>'
    +'<li>Vehicle and equipment incidents <span class="es" style="display:inline">/ Incidentes de veh&iacute;culos y equipos</span></li>'
    +'<li>Property damage and utility strikes <span class="es" style="display:inline">/ Da&ntilde;os a la propiedad y golpes a servicios</span></li>'
    +'<li>Spills and releases <span class="es" style="display:inline">/ Derrames y fugas</span></li>'
    +'</ul>'
    +'<p style="margin-top:10px">Report right away to your supervisor and Turner Safety.<br><span class="es">Reporte de inmediato a su supervisor y a Seguridad de Turner.</span></p></div>';
}
function showEmergency(){
  state.em=true;
  tabsEl.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  secEl.querySelectorAll('.section').forEach(function(x){ x.classList.toggle('active',x.id==='sec_emergency'); });
  renderEmergency();
}
document.getElementById('emBtn').addEventListener('click',function(){
  showEmergency();
  /* On a phone, jump straight to the call buttons; the EMERGENCY bar stays pinned above. */
  if(window.innerWidth<700){ var b=document.getElementById('emBack'); window.scrollTo(0, b.getBoundingClientRect().top+window.pageYOffset-76); }
  else window.scrollTo(0,0);
});
document.addEventListener('click',function(e){
  if(e.target.closest('#emBack')){ setTab('all'); window.scrollTo(0,0); return; }
  if(e.target.closest('#langBtn')){
    lang = lang==='en'?'es':'en';
    try{ localStorage.setItem('anc2lang',lang); }catch(err){}
    applyLang(); return;
  }
  if(e.target.closest('#pendBtn')){ openPending(); return; }
  if(e.target.closest('#pinBtn')){ openChangePin(); return; }
  if(e.target.closest('#lockStatusBtn')){
    if(isUnlocked()) auth.signOut(); else requireUnlock(function(){ toast(t('unlocked')); });
  }
});
if(location.hash==='#emergency') state.em=true;

/* Edit PIN, same as the Aura directory: changes the owner sign-in password. The PIN is never stored in the database. */
function openChangePin(){
  if(!isUnlocked()){ requireUnlock(openChangePin); return; }
  var box=function(id,label){ return '<label class="f"><span>'+esc(label)+'</span><input id="'+id+'" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="new-password"></label>'; };
  openModal('<p class="m-name">'+esc(t('pinNewTitle'))+'</p><p class="m-sub" style="margin-top:4px">'+esc(t('pinNewSub'))+'</p>'
    +box('pinA',t('pinNew'))+box('pinB',t('pinAgain'))
    +'<div class="actions"><a class="btn call" href="#" id="pinSave">'+esc(t('pinSave'))+'</a><a class="btn" href="#" data-close="1">'+esc(t('close'))+'</a></div>');
  var a=document.getElementById('pinA'), b=document.getElementById('pinB'); setTimeout(function(){ a.focus(); },50);
  function save(e){
    if(e) e.preventDefault();
    var p1=a.value.trim(), p2=b.value.trim();
    if(!/^\d+$/.test(p1)){ alert(t('pinDigits')); return; }
    if(p1.length<4){ alert(t('pinShort')); return; }
    if(p1==='1234'){ alert(t('pin1234')); return; }
    if(p1!==p2){ alert(t('pinMismatch')); b.value=''; b.focus(); return; }
    auth.currentUser.updatePassword('aura!'+p1).then(function(){ closeModal(); toast(t('pinDone')); })
      .catch(function(err){ alert(err.code==='auth/requires-recent-login'?t('pinRelog'):err.message); });
  }
  document.getElementById('pinSave').addEventListener('click',save);
  b.addEventListener('keydown',function(e){ if(e.key==='Enter') save(e); });
}
rebuild();
})();
</script>
