<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#071226">
<title>Amgen ANC-2 &mdash; HSE Directory</title>
<style>
  :root{
    --bg:#060d1a;
    --surface-1:rgba(255,255,255,0.04);
    --surface-2:rgba(255,255,255,0.07);
    --border-dim:rgba(255,255,255,0.10);
    --border-bright:rgba(255,255,255,0.22);
    --text:#eef3fb;
    --text-2:rgba(230,238,250,0.66);
    --text-3:rgba(230,238,250,0.40);
    --blue:#2f8cff;            /* Turner blue */
    --blue-lite:#8cc2ff;
    --blue-dim:rgba(47,140,255,0.14);
    --blue-border:rgba(47,140,255,0.55);
    --navy:#0b2a5c;
    --teal:#22c3b5;            /* Amgen / medic */
    --teal-dim:rgba(34,195,181,0.13);
    --green:#4cd38a;
    --ruby:#d23b2c;
    --ruby-border:rgba(210,59,44,0.55);
    --shadow-sm:0 2px 8px rgba(0,0,0,0.45);
    --shadow-lg:0 8px 40px rgba(0,0,0,0.72);
  }
  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);padding:16px;min-height:100vh}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 130% 55% at 50% -5%,rgba(47,140,255,0.13) 0%,transparent 65%),
               radial-gradient(ellipse 80% 40% at 90% 105%,rgba(210,59,44,0.05) 0%,transparent 60%)}
  .wrap{max-width:1000px;margin:0 auto;position:relative;z-index:1}

  .topbar{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:4px}
  h1{color:#fff;font-size:22px;font-weight:700;margin:0;text-align:center;letter-spacing:.04em;
     text-shadow:0 0 28px rgba(47,140,255,0.35),0 2px 4px rgba(0,0,0,0.6);padding:0 64px}
  .lang{position:absolute;right:0;top:50%;transform:translateY(-50%);height:34px;padding:0 12px;font-size:13px;font-weight:700;
        border-radius:8px;border:1px solid var(--border-dim);background:var(--surface-2);color:var(--text-2);cursor:pointer}
  .sub{text-align:center;font-size:12px;color:var(--text-3);margin:6px 0 12px}
  .sub b{color:var(--blue-lite);font-weight:600}

  .hotline-bar{display:block;width:100%;text-align:center;cursor:pointer;color:#fff;font-size:20px;font-weight:700;letter-spacing:.06em;
    padding:14px 18px;border-radius:12px;margin-bottom:14px;border:1px solid var(--ruby-border);
    background:linear-gradient(135deg,rgba(210,59,44,0.85),rgba(140,22,14,0.78));
    box-shadow:0 0 32px rgba(210,59,44,0.35),inset 0 1px 0 rgba(255,255,255,0.14),0 4px 24px rgba(0,0,0,0.6)}
  .hotline-bar small{display:block;font-size:12px;font-weight:400;letter-spacing:.02em;opacity:.85;margin-top:3px}

  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
  .tab-btn{height:54px;font-size:15px;font-weight:600;border-radius:10px;border:1px solid var(--border-dim);
    background:var(--surface-1);color:var(--text-2);cursor:pointer;padding:0 8px;line-height:1.15;
    transition:background .18s,border-color .18s,color .18s,box-shadow .18s}
  .tab-btn:hover{background:var(--surface-2);border-color:var(--border-bright);color:var(--text)}
  .tab-btn.active{background:linear-gradient(135deg,rgba(47,140,255,0.30),rgba(20,90,200,0.18));border-color:var(--blue-border);
    color:#fff;box-shadow:0 0 18px rgba(47,140,255,0.22),inset 0 1px 0 rgba(140,194,255,0.25)}
  .tab-btn .n{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--blue-lite);opacity:.9}

  .hint{font-size:13px;color:var(--text-2);margin:0 0 10px;line-height:1.4}
  .toolbar{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;height:52px;font-size:18px;padding:0 16px;border-radius:10px;border:1px solid var(--border-dim);
    background:rgba(255,255,255,0.05);color:var(--text);outline:none}
  .search::placeholder{color:var(--text-3)}
  .search:focus{border-color:var(--blue-border);box-shadow:0 0 0 3px rgba(47,140,255,0.15)}
  .filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  select{height:44px;font-size:15px;padding:0 10px;border-radius:10px;border:1px solid var(--border-dim);background:rgba(255,255,255,0.06);
    color:var(--text);outline:none;cursor:pointer;max-width:100%}
  select option{background:#0d1626;color:var(--text)}
  .count{color:var(--text-3);font-size:14px;margin-left:auto}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .card{background:linear-gradient(135deg,rgba(255,255,255,0.06),rgba(255,255,255,0.028));border-radius:12px;padding:14px;display:flex;gap:12px;
    align-items:center;cursor:pointer;border:1.5px solid var(--border-dim);min-width:0;
    box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,0.07);transition:border-color .2s,box-shadow .2s,background .2s}
  .card.turner{border-color:rgba(47,140,255,0.38)}
  .card.amgen{border-color:rgba(34,195,181,0.42)}
  .card:hover,.card.turner:hover,.card.amgen:hover{border-color:var(--blue);
    box-shadow:0 0 0 2px rgba(47,140,255,0.6),0 0 30px rgba(47,140,255,0.3),var(--shadow-sm);
    background:linear-gradient(135deg,rgba(47,140,255,0.18),rgba(47,140,255,0.07))}
  @media (hover:none){.card:hover,.card.turner:hover,.card.amgen:hover{box-shadow:var(--shadow-sm);background:linear-gradient(135deg,rgba(255,255,255,0.06),rgba(255,255,255,0.028))}
    .card:hover{border-color:var(--border-dim)}.card.turner:hover{border-color:rgba(47,140,255,0.38)}.card.amgen:hover{border-color:rgba(34,195,181,0.42)}}
  .card:active{background:rgba(47,140,255,0.16)}
  .card-body{min-width:0;flex:1}
  .avatar{width:42px;height:42px;min-width:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
    background:linear-gradient(135deg,#5b6b84,#3a4659);color:#fff;border:1px solid rgba(255,255,255,0.18)}
  .avatar.turner{background:linear-gradient(135deg,#2f8cff,#1456b8);border-color:rgba(140,194,255,0.6);box-shadow:0 0 12px rgba(47,140,255,0.3)}
  .avatar.amgen{background:linear-gradient(135deg,#22c3b5,#0f7d74);border-color:rgba(34,195,181,0.6)}
  .card-name{font-weight:700;font-size:15px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-sub{font-size:13px;color:var(--text-2);margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tags{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;color:var(--blue-lite);background:var(--blue-dim);border:1px solid rgba(47,140,255,0.3)}
  .tag.safe{color:var(--green);background:rgba(76,211,138,0.12);border-color:rgba(76,211,138,0.32)}
  .tag.amg{color:var(--teal);background:var(--teal-dim);border-color:rgba(34,195,181,0.35)}

  .group{margin:22px 0 10px;padding:10px 12px;border-radius:10px;background:var(--surface-1);border-left:4px solid var(--blue);
    display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
  .group:first-child{margin-top:0}
  .group h2{margin:0;font-size:16px;color:#fff}
  .group .meta{font-size:13px;color:var(--text-2)}
  .group .sup{font-size:13px;color:var(--blue-lite);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .group.contractor{border-left-color:#7d8ba3}

  .empty{text-align:center;color:var(--text-3);padding:40px 0;font-size:16px}
  .section{display:none}.section.active{display:block}

  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    align-items:center;justify-content:center;padding:16px;z-index:1000}
  #overlay.open{display:flex}
  #modal{background:linear-gradient(145deg,rgba(14,24,44,0.98),rgba(6,12,24,0.99));border:1px solid var(--border-bright);border-radius:16px;padding:22px;
    max-width:460px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg),0 0 44px rgba(47,140,255,0.10);position:relative}
  .x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--border-dim);background:var(--surface-2);
    color:var(--text);font-size:20px;cursor:pointer;line-height:1}
  .m-head{display:flex;gap:14px;align-items:center;margin:0 34px 14px 0}
  .m-head .avatar{width:56px;height:56px;min-width:56px;font-size:17px}
  .m-name{font-size:20px;font-weight:700;margin:0}
  .m-title{font-size:14px;color:var(--text-2);margin:3px 0 0}
  table{width:100%;font-size:15px;border-top:1px solid var(--border-dim);border-collapse:collapse;margin-bottom:14px}
  td{padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.05);vertical-align:top}
  .lbl{color:var(--text-3);white-space:nowrap;padding-right:12px}
  .val{text-align:right;word-break:break-word}
  .val a{color:var(--blue-lite);text-decoration:none}
  .val .lnk{color:var(--blue-lite);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{display:flex;align-items:center;justify-content:center;height:50px;border-radius:10px;font-size:16px;font-weight:700;text-decoration:none;
    color:#fff;background:var(--surface-2);border:1px solid var(--border-dim);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  .btn.call{background:linear-gradient(135deg,#2f8cff,#1456b8);border-color:var(--blue-border)}
  .btn.save{grid-column:1/-1;background:linear-gradient(135deg,rgba(76,211,138,0.9),rgba(30,150,90,0.85));border-color:rgba(76,211,138,0.6);color:#04210f}
  .btn.full{grid-column:1/-1}
  .btn.red{background:linear-gradient(135deg,#d23b2c,#8c160e);border-color:var(--ruby-border)}
  .btn.disabled{opacity:.35;pointer-events:none}

  .em-h{font-size:22px;font-weight:800;color:#ff8a7a;margin:0 34px 4px 0;letter-spacing:.04em}
  .em-sec{margin:16px 0 6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--text-3);text-transform:uppercase}
  .em-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-1);border:1px solid var(--border-dim);margin-bottom:6px}
  .em-row .t{flex:1;min-width:0}
  .em-row .t b{display:block;font-size:15px}
  .em-row .t span{font-size:13px;color:var(--text-2)}
  .em-row a.dial{flex:0 0 auto;height:42px;padding:0 14px;display:flex;align-items:center;border-radius:9px;font-weight:700;font-size:14px;text-decoration:none;color:#fff;
    background:linear-gradient(135deg,#2f8cff,#1456b8);white-space:nowrap}
  .em-row.big{border-color:var(--ruby-border);background:rgba(210,59,44,0.12)}
  .em-row.big a.dial{background:linear-gradient(135deg,#d23b2c,#8c160e);font-size:17px;height:48px;padding:0 16px}
  .em-addr{font-size:14px;line-height:1.45;color:var(--text);padding:10px 12px;border-radius:10px;background:var(--surface-1);border:1px solid var(--border-dim);margin-bottom:6px}
  .em-addr a{color:var(--blue-lite)}


  .status{text-align:center;font-size:12px;margin:-6px 0 12px;color:var(--text-3)}
  .status.live{color:#6fcf6f;text-shadow:0 0 8px rgba(111,207,111,0.4)}
  .status.off{color:#e0a64a}
  .adminbar{display:none;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:-4px 0 12px;font-size:13px;color:var(--blue-lite)}
  .adminbar.on{display:flex}
  .adminbar button{height:36px;font-size:13px;padding:0 12px;border-radius:8px;border:1px solid var(--border-dim);background:var(--surface-2);color:var(--text);cursor:pointer}
  .adminbar .pend{border-color:rgba(224,166,74,0.6);color:#ffc773}
  .addbtn{height:52px;padding:0 18px;font-size:16px;font-weight:700;border-radius:10px;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,#2f8cff,#1456b8);border:1px solid var(--blue-border)}
  .tag.vac{color:#ffc773;background:rgba(224,166,74,0.13);border-color:rgba(224,166,74,0.4)}
  .divider{border-top:1px solid var(--border-dim);margin:14px 0 8px;padding-top:8px;font-size:12px;color:var(--text-3)}
  .stack{display:grid;gap:8px}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .btn.ghost{background:var(--surface-1)}
  .btn.redline{background:rgba(210,59,44,0.08);border-color:rgba(210,59,44,0.45);color:#ff8a7a;font-size:15px}
  .btn.del{background:rgba(210,59,44,0.18);border-color:rgba(210,59,44,0.5);color:#ff8a7a;font-weight:600}
  .btn.plain{font-weight:600;font-size:15px}
  .btn.vacbtn{background:#fff3dc;color:#5a3a00;border-color:#e8c27a;font-size:15px;margin-top:8px}
  .btn.small{height:42px;font-size:14px}
  .note{font-size:12px;color:var(--text-3);margin:6px 0 0;text-align:center}
  .addph{color:#ffc773;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .f{display:block;margin:0 0 10px}
  .f span{display:block;font-size:12px;color:var(--text-3);margin-bottom:4px}
  .f input,.f textarea,.f select{width:100%;height:46px;font-size:16px;padding:0 12px;border-radius:9px;border:1px solid var(--border-dim);
    background:rgba(255,255,255,0.06);color:var(--text);outline:none;font-family:inherit}
  .f textarea{height:80px;padding:10px 12px;resize:vertical}
  .f input:focus,.f textarea:focus{border-color:var(--blue-border)}
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 12px}
  .checks label{display:flex;gap:8px;align-items:center;font-size:14px;padding:8px 10px;border-radius:8px;background:var(--surface-1);border:1px solid var(--border-dim)}
  .checks input{width:18px;height:18px}
  .m-sub{font-size:13px;color:var(--text-2);margin:-6px 0 14px}
  .req{padding:10px 12px;border-radius:10px;background:var(--surface-1);border:1px solid var(--border-dim);margin-bottom:8px;font-size:14px;line-height:1.45}
  .req b{color:#fff}.req .chg{color:var(--blue-lite)}
  .req .acts{display:flex;gap:8px;margin-top:8px}
  .req .acts .btn{height:40px;flex:1;font-size:14px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f2a52;color:#fff;border:1px solid var(--blue-border);padding:10px 16px;border-radius:10px;
    font-size:14px;z-index:2000;box-shadow:var(--shadow-lg);display:none;max-width:90vw;text-align:center}
  footer{text-align:center;color:var(--text-3);font-size:11px;margin:30px 0 8px;line-height:1.6}

  @media (max-width:560px){
    body{padding:12px}
    h1{font-size:18px;padding:0 56px 0 0;text-align:left}
    .topbar{justify-content:flex-start}
    .tabs{grid-template-columns:repeat(2,1fr)}
    .tab-btn{font-size:14px;height:50px}
    .hotline-bar{font-size:18px}
    .search{font-size:16px}
    select{flex:1 1 45%;min-width:0}
    .count{width:100%;margin-left:0}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1 data-i="title">Amgen ANC-2 &mdash; HSE Directory</h1>
    <button class="lang" id="langBtn" type="button">ES</button>
  </div>
  <div class="sub"><b>Bengal</b> &middot; Holly Springs, NC &middot; <span id="totalLbl"></span></div>

  <div class="tabs" id="tabs"></div>
  <div id="sections"></div>

  <footer>
    <span data-i="foot">For project communication only. Do not forward or post outside the project.</span><br>
    <span data-i="foot2">Something wrong? Open the person and tap Suggest a correction.</span><br>
    <span style="opacity:.7">build v2-live &middot; Oct 14, 2026</span>
  </footer>
</div>

<div class="toast" id="toast"></div>

/* One-time update from the 14 Oct 2026 walk sign-in sheets: adds new people and fills blank numbers in the live list.
   Runs only for the owner, only on live data, never overwrites a number that is already there. */
function applyPatches(){
  if(!(FB && isUnlocked() && liveEmpty===false && liveSeen && !renderStatus.cache) || patching) return;
  var have={}; PEOPLE.forEach(function(p){ have[p.id]=p; });
  var b=db.batch(), n=0;
  PATCHES.forEach(function(x){
    if(x.op==='add'){
      if(!have[x.p.id]){ var o=clean(x.p); delete o.id; b.set(db.collection(COLL).doc(x.p.id), o); n++; }
    } else {
      var cur=have[x.id]; if(!cur) return;
      var u={}, k; for(k in x.set){ if(!cur[k]) u[k]=x.set[k]; }
      if(Object.keys(u).length){ b.update(db.collection(COLL).doc(x.id), u); n++; }
    }
  });
  if(!n) return;
  patching=b.commit().then(function(){ toast('Sign-in sheet updates saved ('+n+')'); }).catch(function(e){ patching=null; console.warn(e); });
}
/* First unlock publishes the built-in list so every later edit has a document to change. */
function ensureSeeded(){
  if(!(isUnlocked() && liveEmpty===true)) return Promise.resolve();
  if(seeding) return seeding;
  toast(t('publishing'));
  var b=db.batch();
  EMBED.forEach(function(p){ var o=clean(p); delete o.id; b.set(db.collection(COLL).doc(p.id), o); });
  seeding=b.commit().then(function(){ toast(t('published')); }).catch(function(e){ seeding=null; alert('Could not publish: '+e.message); throw e; });
  return seeding;
}

    html+='<div class="req"><b>'+esc(r.personName)+'</b>'+Object.keys(r.requested||{}).map(function(k){

  });
  pendRem.forEach(function(r){
    html+='<div class="req"><b>'+esc(r.name)+'</b> ('+esc(r.company)+') '+esc(t('wantsRemoved'))+(r.reason?'<br><i>'+esc(r.reason)+'</i>':'')
      +'<div class="acts"><a class="btn red" href="#" data-remove="'+esc(r._id)+'">'+esc(t('removePerson'))+'</a><a class="btn" href="#" data-dismiss="r:'+esc(r._id)+'">'+esc(t('dismiss'))+'</a></div></div>';
  });
  html+='<div class="actions" style="margin-top:8px"><a class="btn full" href="#" data-close="1">'+esc(t('close'))+'</a></div>';
  openModal(html);
}
modal.addEventListener('click',function(e){
  var a=e.target.closest('[data-apply],[data-dismiss],[data-remove]'); if(!a) return;
  e.preventDefault();
  var done=function(){ setTimeout(openPending,400); };
  if(a.dataset.apply){
    var r=pendChg.filter(function(x){return x._id===a.dataset.apply;})[0]; if(!r) return;
    var upd=Object.assign({}, r.requested, {updatedAt:TS()});
    db.collection(COLL).doc(r.contactId).update(upd).then(function(){ return db.collection(CHG).doc(r._id).delete(); }).then(done).catch(function(err){ alert(err.message); });
  } else if(a.dataset.remove){
    var q=pendRem.filter(function(x){return x._id===a.dataset.remove;})[0]; if(!q) return;
    if(!confirm(t('confirmDel').replace('{n}',q.name))) return;
    db.collection(COLL).doc(q.contactId).delete().then(function(){ return db.collection(REM).doc(q._id).delete(); }).then(done).catch(function(err){ alert(err.message); });
  } else {
    var parts=a.dataset.dismiss.split(':');
    db.collection(parts[0]==='c'?CHG:REM).doc(parts[1]).delete().then(done).catch(function(err){ alert(err.message); });
  }
});

document.addEventListener('click',function(e){
  var add=e.target.closest('[data-add]'); if(add){ requireUnlock(function(){ openEdit(null, add.dataset.add); }); return; }
  var act=e.target.closest('[data-act]');
  if(act){ e.preventDefault(); var p=BY[modal.dataset.pid]; if(!p) return;
    var k=act.dataset.act;
    if(k==='edit') requireUnlock(function(){ openEdit(BY[p.id]||p); });

  if(c && c.dataset.id){ openPerson(c.dataset.id); return; }

/* Save to Contacts: a real .vcf file at a real https address is the only thing that works on
   every phone. Embedded browsers (Gmail, Messages, Outlook, Teams) hand the file to a preview
   with no "Add to Contacts", so hop out to the real browser first. */
function isEmbedded(){
  var ua=navigator.userAgent||'';
  if(/iPad|iPhone|iPod/.test(ua)){
    if(window.navigator.standalone===true) return false;
    if(/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua)) return false;
    if(/(FBAN|FBAV|Instagram|Line\/|Twitter|LinkedInApp|MicroMessenger|Snapchat|GSA\/)/i.test(ua)) return true;
    return !(/Version\//.test(ua) && /Safari\//.test(ua));
  }
  if(/Android/.test(ua)) return /;\s*wv\)/.test(ua) || /\bwv\b/.test(ua);
  return false;
}
function saveContact(a,ev){
  try{
    if(!isEmbedded()) return true;
    var abs=a.href, ua=navigator.userAgent||'';
    if(/iPad|iPhone|iPod/.test(ua)){ ev.preventDefault(); window.location.href='x-safari-'+abs; return false; }
    if(/Android/.test(ua)){ ev.preventDefault(); window.location.href='intent://'+abs.replace(/^https?:\/\//,'')+'#Intent;scheme=https;action=android.intent.action.VIEW;end'; return false; }
  }catch(err){}
  return true;
}
